<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusSphere - Notice Management</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="dashboard-header">

        <div>

            <h1>CampusSphere</h1>

            <p>
                Teacher Management Portal
            </p>

        </div>


        <button
            class="logout-btn"
            type="button"
            onclick="window.location.href='index.html'">

            Logout

        </button>

    </header>



    <!-- ========================= -->
    <!-- WELCOME -->
    <!-- ========================= -->

    <section class="welcome-section">

        <h2>
            📢 Notice Management
        </h2>

        <p>
            Create, edit and manage important college notices.
        </p>

    </section>



    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main class="notice-management-container">


        <!-- ========================= -->
        <!-- NOTICE FORM -->
        <!-- ========================= -->

        <div class="notice-form">

            <h2 id="formHeading">
                ➕ Create New Notice
            </h2>


            <!-- Notice Title -->

            <label for="noticeTitle">
                Notice Title
            </label>

            <input
                type="text"
                id="noticeTitle"
                placeholder="Enter notice title">



            <!-- Notice Description -->

            <label for="noticeDescription">
                Notice Details
            </label>

            <textarea
                id="noticeDescription"
                rows="6"
                placeholder="Enter notice information"></textarea>



            <!-- Notice Date -->

            <label for="noticeDate">
                Notice Date
            </label>

            <input
                type="date"
                id="noticeDate">



            <!-- Posted By -->

            <label for="postedBy">
                Posted By
            </label>

            <select id="postedBy">

                <option value="">
                    Select
                </option>

                <option value="Faculty">
                    Faculty
                </option>

                <option value="Administration">
                    Administration
                </option>

            </select>



            <!-- Publish / Update -->

            <button
                type="button"
                class="save-btn"
                id="saveNoticeButton"
                onclick="saveNotice()">

                📢 Publish Notice

            </button>



            <!-- Cancel Edit -->

            <button
                type="button"
                id="cancelEditButton"
                onclick="cancelEdit()"
                style="display: none;">

                ❌ Cancel Edit

            </button>

        </div>



        <!-- ========================= -->
        <!-- PUBLISHED NOTICES -->
        <!-- ========================= -->

        <div class="notice-list">

            <h2>
                📢 Published Notices
            </h2>


            <div id="noticeContainer">

                <p>
                    No notices published yet.
                </p>

            </div>

        </div>


    </main>



    <!-- ========================= -->
    <!-- BACK BUTTON -->
    <!-- ========================= -->

    <div
        style="text-align: center; margin: 30px;">

        <button
            type="button"
            onclick="window.location.href='teacher-dashboard.html'">

            ← Back to Teacher Dashboard

        </button>

    </div>



    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>


        // =========================================
        // CURRENT EDITING NOTICE
        // =========================================

        let editingIndex = -1;



        // =========================================
        // SAVE / PUBLISH NOTICE
        // =========================================

        function saveNotice() {


            const title =
                document.getElementById("noticeTitle")
                .value
                .trim();


            const description =
                document.getElementById("noticeDescription")
                .value
                .trim();


            const date =
                document.getElementById("noticeDate")
                .value;


            const postedBy =
                document.getElementById("postedBy")
                .value;



            // Validation

            if (
                title === "" ||
                description === "" ||
                date === "" ||
                postedBy === ""
            ) {

                alert(
                    "⚠️ Please fill all the fields."
                );

                return;

            }



            // Get existing notices

            let notices =
                JSON.parse(
                    localStorage.getItem(
                        "campusSphereNotices"
                    )
                ) || [];



            // Create notice object

            const notice = {

                title: title,

                description: description,

                date: date,

                postedBy: postedBy

            };



            // =========================================
            // EDIT EXISTING NOTICE
            // =========================================

            if (editingIndex !== -1) {

                notices[editingIndex] = notice;


                localStorage.setItem(
                    "campusSphereNotices",
                    JSON.stringify(notices)
                );


                alert(
                    "✅ Notice updated successfully!"
                );


                editingIndex = -1;

                resetForm();

                displayNotices();

                return;

            }



            // =========================================
            // ADD NEW NOTICE
            // =========================================

            notices.push(notice);


            localStorage.setItem(
                "campusSphereNotices",
                JSON.stringify(notices)
            );


            alert(
                "✅ Notice published successfully!"
            );


            resetForm();

            displayNotices();

        }



        // =========================================
        // DISPLAY NOTICES
        // =========================================

        function displayNotices() {


            const container =
                document.getElementById(
                    "noticeContainer"
                );


            const notices =
                JSON.parse(
                    localStorage.getItem(
                        "campusSphereNotices"
                    )
                ) || [];



            // No notices

            if (notices.length === 0) {

                container.innerHTML = `
                    <p>
                        No notices published yet.
                    </p>
                `;

                return;

            }



            // Clear old content

            container.innerHTML = "";



            // Display every notice

            notices.forEach(
                function(notice, index) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "notice";



                    card.innerHTML = `

                        <h3>
                            📢 ${escapeHTML(notice.title)}
                        </h3>

                        <p>
                            ${escapeHTML(notice.description)}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${escapeHTML(notice.date)}
                        </p>

                        <small>
                            Posted by:
                            ${escapeHTML(notice.postedBy)}
                        </small>

                        <br>
                        <br>

                        <button
                            type="button"
                            onclick="editNotice(${index})">

                            ✏️ Edit Notice

                        </button>


                        <button
                            type="button"
                            onclick="deleteNotice(${index})">

                            🗑️ Delete Notice

                        </button>

                    `;



                    container.appendChild(card);

                }
            );

        }



        // =========================================
        // EDIT NOTICE
        // =========================================

        function editNotice(index) {


            const notices =
                JSON.parse(
                    localStorage.getItem(
                        "campusSphereNotices"
                    )
                ) || [];



            const notice =
                notices[index];



            if (!notice) {

                alert(
                    "⚠️ Notice not found."
                );

                return;

            }



            // Put notice data back into form

            document.getElementById(
                "noticeTitle"
            ).value =
                notice.title;


            document.getElementById(
                "noticeDescription"
            ).value =
                notice.description;


            document.getElementById(
                "noticeDate"
            ).value =
                notice.date;


            document.getElementById(
                "postedBy"
            ).value =
                notice.postedBy;



            // Store index

            editingIndex = index;



            // Change heading

            document.getElementById(
                "formHeading"
            ).innerText =
                "✏️ Edit Notice";



            // Change button text

            document.getElementById(
                "saveNoticeButton"
            ).innerText =
                "💾 Update Notice";



            // Show cancel button

            document.getElementById(
                "cancelEditButton"
            ).style.display =
                "block";



            // Scroll to form

            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }



        // =========================================
        // CANCEL EDIT
        // =========================================

        function cancelEdit() {


            editingIndex = -1;


            resetForm();


            alert(
                "Edit cancelled."
            );

        }



        // =========================================
        // RESET FORM
        // =========================================

        function resetForm() {


            document.getElementById(
                "noticeTitle"
            ).value = "";


            document.getElementById(
                "noticeDescription"
            ).value = "";


            document.getElementById(
                "noticeDate"
            ).value = "";


            document.getElementById(
                "postedBy"
            ).value = "";



            document.getElementById(
                "formHeading"
            ).innerText =
                "➕ Create New Notice";



            document.getElementById(
                "saveNoticeButton"
            ).innerText =
                "📢 Publish Notice";



            document.getElementById(
                "cancelEditButton"
            ).style.display =
                "none";

        }



        // =========================================
        // DELETE NOTICE
        // =========================================

        function deleteNotice(index) {


            let notices =
                JSON.parse(
                    localStorage.getItem(
                        "campusSphereNotices"
                    )
                ) || [];



            if (!notices[index]) {

                return;

            }



            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this notice?"
                );



            if (!confirmDelete) {

                return;

            }



            notices.splice(
                index,
                1
            );



            localStorage.setItem(
                "campusSphereNotices",
                JSON.stringify(notices)
            );



            displayNotices();



            alert(
                "🗑️ Notice deleted successfully."
            );

        }



        // =========================================
        // SECURITY / HTML TEXT HANDLING
        // =========================================

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }



        // =========================================
        // LOAD NOTICES WHEN PAGE OPENS
        // =========================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                displayNotices();

            }
        );


    </script>


</body>

</html>
