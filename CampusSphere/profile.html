<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSphere - My Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-container">

        <h1>CampusSphere</h1>
        <p class="tagline">Smart & Secure Digital Campus</p>

        <div class="profile-box">

            <h2>My Profile</h2>
            <p>View and update your personal information.</p>

            <form id="profileForm">

                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>

                <label>Course</label>
                <input type="text" id="course" placeholder="Enter your course" required>

                <label>Roll Number</label>
                <input type="text" id="roll" placeholder="Enter your roll number" required>

                <label>Semester</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option>1st Semester</option>
                    <option>2nd Semester</option>
                    <option>3rd Semester</option>
                    <option>4th Semester</option>
                    <option>5th Semester</option>
                    <option>6th Semester</option>
                </select>

                <label>Address</label>
                <textarea id="address" placeholder="Enter your address"></textarea>

                <button type="submit">Save Profile</button>

            </form>

            <p id="message"></p>

            <button class="back-btn" onclick="window.location.href='dashboard.html'">
                Back to Dashboard
            </button>

        </div>

    </div>

    <script>
        document.getElementById("profileForm").addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("message").innerText =
                "Profile updated successfully!";

        });
    </script>

</body>
</html>
